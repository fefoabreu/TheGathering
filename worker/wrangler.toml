name = "tgs-hanna"
main = "src/index.js"
compatibility_date = "2026-08-12"

# The Anthropic API key is NOT here. It is an encrypted Worker secret:
#   wrangler secret put ANTHROPIC_API_KEY
# Nothing in this file is sensitive, which is why it is safe to commit.

# Served on a subdomain of the site's own zone rather than workers.dev —
# one less hostname, and it keeps the agent under the project's domain.
workers_dev = false

[[routes]]
pattern = "hanna.fefoabreu.me"
custom_domain = true

# Caches the Google Calendar feed so we are not refetching it per page view.
[[kv_namespaces]]
binding = "HANNA_CACHE"
id = "78d83d4847bd4b02b9fb235db1b0be48"

[vars]
MODEL = "claude-sonnet-5"

# Owner-only enforcement. OFF until Google sign-in is confirmed working —
# turning it on before then would lock the owners out of their own portal,
# because an anonymous session carries no email. Flip to "true" once an owner
# has signed in with Google and reached the portal.
ENFORCE_OWNER = "false"

[observability]
enabled = true
