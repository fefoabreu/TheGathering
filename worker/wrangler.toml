name = "tgs-hanna"
main = "src/index.js"
compatibility_date = "2026-08-12"

# The Anthropic API key is NOT here. It is an encrypted Worker secret:
#   wrangler secret put ANTHROPIC_API_KEY
# Nothing in this file is sensitive, which is why it is safe to commit.

# Served on a subdomain of the site's own zone rather than workers.dev —
# one less hostname, and it keeps the agent under the project's domain.
workers_dev = false

[[routes]]
pattern = "hanna.fefoabreu.me"
custom_domain = true

# Refreshes the merged property calendar (Google "TheGathering" + Airbnb) into
# KV every hour. See buildCalendar() in src/index.js.
[triggers]
crons = ["7 * * * *"]

# Holds the merged calendar (cal:v3) and Hanna's knowledge snapshot.
[[kv_namespaces]]
binding = "HANNA_CACHE"
id = "78d83d4847bd4b02b9fb235db1b0be48"

[vars]
MODEL = "claude-sonnet-5"

# Routed to only for contract analysis and ROI projection — genuine reasoning
# work. Everything conversational stays on Sonnet, which is most of the traffic.
MODEL_ANALYSIS = "claude-opus-5"

# Owner-only enforcement: every model call must come from an allowlisted
# Google account (OWNER_EMAILS in src/index.js — the house account). ON since
# 2026-10-15, once Google sign-in was confirmed working. Off, any visitor's
# anonymous guest token could run Hanna on the owners' API credits.
ENFORCE_OWNER = "true"

[observability]
enabled = true
